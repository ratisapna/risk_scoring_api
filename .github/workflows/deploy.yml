name: Deploy to Render

on:
  push:
    branches: [master]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Format check with Black
        run: black --check app/ tests/

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Build Docker image
        run: docker build -t risk-scoring-api:${{ github.sha }} .

      - name: Trigger Render deployment
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_clear"}'

      - name: Wait for deployment and run smoke test
        run: |
          RENDER_URL="${{ secrets.RENDER_URL }}"
          echo "Waiting for deployment at $RENDER_URL..."

          for i in {1..60}; do
            if curl -f -s "$RENDER_URL/health" > /dev/null 2>&1; then
              echo "✓ Deployment successful! Service is healthy."
              exit 0
            fi
            echo "Attempt $i/60: Service not ready, retrying in 5s..."
            sleep 5
          done

          echo "✗ Deployment failed: /health endpoint not responding after 5 minutes"
          exit 1

      - name: Deployment summary
        run: |
          echo "✓ CI passed"
          echo "✓ Docker image built"
          echo "✓ Deployment triggered on Render"
          echo "✓ Smoke test passed"
          echo ""
          echo "Service is live at: ${{ secrets.RENDER_URL }}"
